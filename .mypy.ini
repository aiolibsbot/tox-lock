[mypy]
python_version = 3.10
color_output = true
error_summary = true
files =
  src/,
  tests/,

check_untyped_defs = true

disallow_any_explicit = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true

enable_error_code =
  ignore-without-code

explicit_package_bases = true

extra_checks = true

follow_imports = normal

ignore_missing_imports = false

local_partial_types = true

# NOTE: `tests/` is an import root as much as `src/` is: `pytest`
# NOTE: prepends it for a test directory holding no `__init__.py`,
# NOTE: which is how the suite reaches the helpers beside it.
mypy_path = ${MYPY_CONFIG_FILE_DIR}/src:${MYPY_CONFIG_FILE_DIR}/tests:${MYPY_CONFIG_FILE_DIR}/_type_stubs

namespace_packages = true

no_implicit_reexport = true

pretty = true

show_column_numbers = true
show_error_code_links = true
show_error_codes = true
show_error_context = true
show_error_end = true

# `strict` will pick up any future strictness-related settings:
strict = true
strict_equality = true
strict_optional = true

warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[mypy-tox_plugins.lock._plugin]
# crashes with some decorators like `@tox.plugin.impl`:
disallow_any_expr = false

# NOTE: Named one by one, and without a `tests.` prefix, because that
# NOTE: is what these modules are called: `tests/` holds no
# NOTE: `__init__.py`, so nothing in it is inside a package at runtime,
# NOTE: and naming the directory as an import root above makes `mypy`
# NOTE: agree. A partial wildcard (`*_test`) is not a pattern `mypy`
# NOTE: matches on, and it does not say so -- it silently relaxes
# NOTE: nothing. A module added here later and left out of this list
# NOTE: fails the env with the decorator errors below; this is where
# NOTE: to add it.
[mypy-conftest,check_scripts_test,dist_contents_test,end_to_end_test,importable_test,integration_test]
# crashes with some decorators like `@pytest.mark.parametrize`:
disallow_any_expr = false
# fails on `@hypothesis.given()`:
disallow_any_decorated = false
