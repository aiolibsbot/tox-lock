---

name: 🧪 CI

on:  # yamllint disable-line rule:truthy
  push:
  pull_request:
  workflow_dispatch:
  # NOTE: Called by the release workflow so that a tag publishes the
  # NOTE: dists this suite has already accepted, rather than a second
  # NOTE: build of its own that nothing ran the matrix against.
  workflow_call:
    outputs:
      dists-artifact-id:
        description: The id of the artifact holding the built dists
        value: ${{ jobs.dists.outputs.artifact-id }}

env:
  FORCE_COLOR: 1

# NOTE: Every job here reads the repository and writes nothing back.
# NOTE: Spelled out because this workflow is also called by the one that
# NOTE: publishes: a reusable workflow cannot be granted more than its
# NOTE: caller holds, and the caller has to know what to grant.
permissions:
  contents: read

jobs:

  supported-pythons:
    name: 🧮 Derive the test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.classifiers.outputs.matrix }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # NOTE: `pyproject.toml` claimed 3.14 and 3.15 in its classifiers
    # NOTE: from the initial commit, and the matrix below used to list
    # NOTE: 3.10 through 3.13 by hand: two public promises that nothing
    # NOTE: had ever tested. Editing the list back into agreement would
    # NOTE: have left the mechanism that let it drift in place, so the
    # NOTE: list is read off the promises instead -- adding a
    # NOTE: classifier now adds a job.
    #
    # NOTE: Run by path, the way `verify-dists` runs its checker: the
    # NOTE: script reads one file with the standard library, and an
    # NOTE: installed dist has nothing to add to that. Inline `python
    # NOTE: -c` would put it beyond the reach of both `ruff` and
    # NOTE: `mypy`, which do not read string literals.
    - name: Read the supported Pythons out of the trove classifiers
      id: classifiers
      run: >-
        python -bb -E -s -I -Werror
        tests/_ci_matrix.py pyproject.toml
        >> "${GITHUB_OUTPUT}"

  test:
    needs: supported-pythons
    name: 🐍 ${{ matrix.python-version }} @ ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.supported-pythons.outputs.matrix) }}

    steps:
    - uses: actions/checkout@v4
      with:
        # NOTE: `setuptools-scm` needs the tags to derive a version.
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        # NOTE: The classifiers reach ahead of the newest final
        # NOTE: release, and without this a pre-release spec resolves
        # NOTE: to the newest final one instead -- which would run the
        # NOTE: suite twice under it and call that a tested claim.
        allow-prereleases: true

    - name: Install tox
      run: python -Im pip install --upgrade 'tox >= 4.55.1'

    - name: Run the test suite
      run: python -Im tox run -e py

  oldest-tox:
    name: 🕰️ Oldest supported tox
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tox
      run: python -Im pip install --upgrade 'tox >= 4.55.1'

    # NOTE: The env pins the declared floor for the `tox` the suite
    # NOTE: drives in-process -- not for the one launching it, which is
    # NOTE: why installing an old `tox` in this step would prove
    # NOTE: nothing.
    - name: Run the test suite against the declared floor
      run: python -Im tox run -e oldest-tox

  type-check:
    name: 🔍 Type check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # NOTE: One job rather than a matrix: `mypy` is told which
    # NOTE: interpreter to analyse for by `python_version` in
    # NOTE: `.mypy.ini`, so running it under four of them would repeat
    # NOTE: the same check four times.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tox
      run: python -Im pip install --upgrade 'tox >= 4.55.1'

    - name: Type-check the plugin and its test suite
      run: python -Im tox run -e type-check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # NOTE: One job rather than a matrix: which rules apply is settled
    # NOTE: by `target-version` in `.ruff.toml`, not by the interpreter
    # NOTE: the linter runs under.
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tox
      run: python -Im pip install --upgrade 'tox >= 4.55.1'

    - name: Lint the sources, the test suite and the CI workflows
      run: python -Im tox run -e lint

  lock-check:
    name: 🔒 Locks up to date
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    # NOTE: Alongside `tox` rather than into a `testenv`: the lock
    # NOTE: envs only exist if the plugin is loaded by the `tox` being
    # NOTE: run, and this job runs them directly rather than a suite.
    - name: Install tox and the plugin it is about to run
      run: python -Im pip install --upgrade 'tox >= 4.55.1' .

    # NOTE: The plugin locking its own dependencies is the only place
    # NOTE: either lock env runs against a real project rather than a
    # NOTE: fixture. This job is what keeps the five locks under
    # NOTE: `requirements/` honest -- and, incidentally, what would
    # NOTE: notice `lock-deps-check` going quietly green on drift.
    - name: Verify the committed locks match their sources
      run: python -Im tox run -e lock-deps-check

  dists:
    name: 📦 Build & check dists
    runs-on: ubuntu-latest
    # NOTE: The artifact is published by *id* rather than by name so
    # NOTE: that the release workflow downloading it shares this job's
    # NOTE: own idea of which upload it means. A name repeated in the
    # NOTE: other file would be a literal in two places whose drift
    # NOTE: surfaces at the one moment nobody wants a red build: on the
    # NOTE: tag, after the dists are already built.
    outputs:
      artifact-id: ${{ steps.upload-dists.outputs.artifact-id }}

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install tox
      run: python -Im pip install --upgrade 'tox >= 4.55.1'

    - name: Build the dists, validate their metadata and their contents
      run: python -Im tox run -e build-dists,metadata-validation,verify-dists

    # NOTE: The plugin is a PEP 420 namespace subpackage, easy to leave out
    # NOTE: of a dist by accident. Installing from the built sdist -- never
    # NOTE: the work tree -- is what catches that.
    - name: Verify the sdist actually ships an importable plugin
      run: |
        set -euxo pipefail
        python -Im venv "${RUNNER_TEMP}/sdist-venv"
        "${RUNNER_TEMP}/sdist-venv/bin/python" -Im pip install \
          --upgrade --no-binary tox-lock dist/*.tar.gz
        "${RUNNER_TEMP}/sdist-venv/bin/python" -Ic \
          'import tox_plugins.lock._plugin as p; print(p.__file__)'

    - uses: actions/upload-artifact@v4
      id: upload-dists
      with:
        name: dists
        path: dist/

...
