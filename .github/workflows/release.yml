---

name: 🚀 Release

# NOTE: A tag is the trigger because `setuptools-scm` derives the
# NOTE: version from one: there is no version string in the tree for a
# NOTE: workflow input to disagree with, and a release built from
# NOTE: anything but a tag would be a development version by
# NOTE: construction.
#
# NOTE: `workflow_dispatch` is the rehearsal. It runs everything the
# NOTE: tag does except the two jobs that hand something out, so that
# NOTE: this file can be exercised -- and the reuse below proven -- on a
# NOTE: branch, without a tag nobody meant to cut and cannot take back.
on:  # yamllint disable-line rule:truthy
  push:
    tags:
    - v*
  workflow_dispatch:

# NOTE: Not cancellable, unlike a CI run: the point of the group is to
# NOTE: keep two tags from publishing at once, not to drop the older
# NOTE: one. An upload interrupted halfway leaves a release on PyPI
# NOTE: that no rerun can replace, filenames there being final.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# NOTE: Nothing at the top, and each job below asks for exactly what it
# NOTE: hands out: the token this workflow starts with is the one that
# NOTE: may publish under the project's name.
permissions: {}

jobs:

  ci:
    name: 🧪 CI
    # NOTE: The suite is *called* rather than depended on. A release
    # NOTE: whose dists came out of a build of its own would be
    # NOTE: publishing an artifact the matrix, the type check, the
    # NOTE: linters and the lock check had all passed judgement on a
    # NOTE: different copy of -- and `verify-dists` in particular exists
    # NOTE: to say what is inside the archive that ships.
    # NOTE: `zizmor` prefers `$/...` here, which resolves to this
    # NOTE: repository without naming it. Both spellings are
    # NOTE: relative to the same place and neither can be
    # NOTE: redirected; `./` is what the reuse was rehearsed with
    # NOTE: and what a reader of GitHub's own docs meets first.
    uses: ./.github/workflows/ci.yml  # zizmor: ignore[self-repository]
    permissions:
      contents: read

  publish-to-pypi:
    name: 📦 Publish to PyPI
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # NOTE: An environment so that the trusted publisher on PyPI can be
    # NOTE: scoped to it, and so that a maintainer may put a required
    # NOTE: reviewer in front of the one irreversible step here.
    environment:
      name: pypi
      url: https://pypi.org/project/tox-lock/

    permissions:
      # NOTE: For the OIDC token PyPI trades for an upload one -- there
      # NOTE: is deliberately no API token in this repository's secrets
      # NOTE: to leak. The same token signs the PEP 740 attestations
      # NOTE: `gh-action-pypi-publish` uploads alongside the dists.
      id-token: write

    steps:
    # NOTE: By id, not by name: the id comes from the very upload step
    # NOTE: that produced it, so this download cannot quietly start
    # NOTE: meaning a different artifact than the one CI built.
    # v4.3.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.ci.outputs.dists-artifact-id }}
        path: dist/
        merge-multiple: true

    # v1.14.2
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33

  github-release:
    name: 🏷️ Publish a GitHub Release
    # NOTE: After PyPI rather than beside it. A tag with a GitHub
    # NOTE: Release against it is what users read as "this version
    # NOTE: exists", and it should not say so while the install command
    # NOTE: underneath it is still failing.
    needs:
    - ci
    - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # NOTE: To create the release. Nothing here pushes a commit.
      contents: write

    steps:
    # NOTE: The tree as well as the dists: the notes below are read out
    # NOTE: of `CHANGELOG.md` at this tag, which is the same text the
    # NOTE: `changelog` job has been checking the fragments for since
    # NOTE: the change was made.
    # v4.4.0
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false

    # v5.6.0
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.13'

    # v4.3.0
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        artifact-ids: ${{ needs.ci.outputs.dists-artifact-id }}
        path: dist/
        merge-multiple: true

    # NOTE: Was `--generate-notes`, which lists the commit subjects
    # NOTE: since the previous tag: what the tree did, in the words of
    # NOTE: whoever wrote the commit, to an audience reading the page
    # NOTE: to find out whether upgrading will break them. The
    # NOTE: changelog is written for that audience instead.
    #
    # NOTE: This step fails the release rather than falling back. A
    # NOTE: tag whose version has no section, or whose fragments were
    # NOTE: never collected, is a tag cut before `towncrier build` --
    # NOTE: and the recoverable end of that mistake is here, before
    # NOTE: PyPI has taken a filename it will never give back.
    - name: Read this version's notes out of the changelog
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python -Ibb -W error tests/_changelog.py \
          notes \
          pyproject.toml \
          CHANGELOG.md \
          changelog.d/ \
          "${RELEASE_TAG#v}" \
          > "${RUNNER_TEMP}/release-notes.md"

    - name: Create the release and attach the dists to it
      env:
        GH_TOKEN: ${{ github.token }}
        # NOTE: Through the environment rather than interpolated into
        # NOTE: the command: a `${{ }}` in a `run` block is pasted in
        # NOTE: as text before the shell ever sees it, so a ref name
        # NOTE: carrying a quote would be running the rest of itself.
        # NOTE: Tag names are constrained, and whoever pushes one here
        # NOTE: already holds write -- which makes this a habit worth
        # NOTE: keeping rather than a hole worth patching.
        RELEASE_TAG: ${{ github.ref_name }}
        RELEASE_REPO: ${{ github.repository }}
      run: >-
        gh release create "${RELEASE_TAG}"
        --repo "${RELEASE_REPO}"
        --title "${RELEASE_TAG}"
        --notes-file "${RUNNER_TEMP}/release-notes.md"
        --verify-tag
        dist/*

...
