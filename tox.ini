[tox]
isolated_build = true
# NOTE: v4.29.0 is the first one to implement the `tox_extend_envs`
# NOTE: lifecycle hook. But the initial version had a bug fixed in
# NOTE: the following version 4.30.0.
#
# Refs:
# * https://github.com/tox-dev/tox/issues/3510
# * https://github.com/tox-dev/tox/pull/3591
# * https://github.com/tox-dev/tox/pull/3598
#
# NOTE: The floor `pyproject.toml` declares is higher still --
# NOTE: v4.55.1, for the config conversion and override handling
# NOTE: the plugin is built on. See the note beside it there, and
# NOTE: the `oldest-tox` env below, which runs the suite against it.
minversion = 4.55.1


[python-cli-options]
byte-warnings = -b
byte-errors = -bb
max-isolation = -E -s -I
some-isolation = -E -s
warnings-to-errors = -Werror


# NOTE: Everything the suite needs *except* `tox` itself, so that the
# NOTE: `oldest-tox` env below can swap which `tox` the tests run
# NOTE: against without restating the rest of the list.
#
# NOTE: `tox`'s `[testing]` extra provides `devpi-process` / `pytest`
# NOTE: (needed by the `tox.pytest` plugin) starting from v4.54.0. They
# NOTE: are listed here rather than left to the extra so that both envs
# NOTE: below get them whichever `tox` they pin.
# Ref: https://github.com/tox-dev/tox/issues/3938
[test-deps]
common =
  covdefaults
  coverage
  devpi-process
  pytest
  pytest-cov
  pytest-subtests
  pytest-xdist


[testenv]
description = Run pytest under {envpython}
deps =
  {[test-deps]common}
  tox [testing]
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m pytest \
      {tty:--color=yes} \
      {posargs:--cov-report=html:{envtmpdir}{/}htmlcov{/}}
commands_post =
  -{envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c \
      'import atexit, os, sys; \
      os.getenv("GITHUB_ACTIONS") == "true" or sys.exit(); \
      import coverage; \
      gh_summary_fd = open(\
        os.environ["GITHUB_STEP_SUMMARY"], encoding="utf-8", mode="a",\
      ); \
      atexit.register(gh_summary_fd.close); \
      cov = coverage.Coverage(); \
      cov.load(); \
      cov.report(file=gh_summary_fd, output_format="markdown")'
  # Print out the output coverage dir and a way to serve html:
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c\
      'import pathlib, shlex, sys; \
      cov_html_report_arg_prefix = "--cov-report=html:"; \
      cov_html_reports = [\
        arg[len(cov_html_report_arg_prefix):] for arg in sys.argv \
        if arg.startswith(cov_html_report_arg_prefix)\
      ]; \
      cov_html_reports or sys.exit(); \
      cov_html_report_dir = pathlib.Path(cov_html_reports[-1]); \
      index_file = cov_html_report_dir / "index.html";\
      index_file.exists() or sys.exit(); \
      html_url = f"file://\{index_file\}";\
      browse_cmd = shlex.join(("python3", "-Im", "webbrowser", html_url)); \
      serve_cmd = shlex.join((\
        "python3", "-Im", "http.server", \
        "--directory", str(cov_html_report_dir), "0", \
      )); \
      print(f"\nTo open the HTML coverage report, run\n\n\
      \t\{browse_cmd !s\}\n");\
      print(f"To serve \
      the HTML coverage report with a local web server, use\n\n\
      \t\{serve_cmd !s\}\n")' \
    {posargs:--cov-report=html:{envtmpdir}{/}htmlcov{/}}
package = editable
pass_env =
  CI
  GITHUB_*
  SSH_AUTH_SOCK
  TERM
set_env =
  COVERAGE_PROCESS_START = {toxinidir}{/}.coveragerc
wheel_build_env = .pkg


# NOTE: The plugin is built out of `tox`'s own configuration
# NOTE: machinery, and that machinery moves: which types core config
# NOTE: converts and whether a `-x` override is expanded before it
# NOTE: reaches the loader both changed under it. So the suite passing
# NOTE: against whatever `tox` a contributor happens to have says
# NOTE: nothing about the floor `pyproject.toml` declares -- the two
# NOTE: drifted apart by twenty-five releases before anyone ran them
# NOTE: together. This env runs the very same tests against that floor,
# NOTE: so that moving it stays a decision rather than a discovery a
# NOTE: user makes for us.
#
# NOTE: The pin belongs here rather than in the CI workflow because the
# NOTE: suite drives `tox` in-process through `tox.pytest`: what gets
# NOTE: exercised is the `tox` installed *into this env*, not the one
# NOTE: that launched it.
[testenv:oldest-tox]
description =
  Run pytest against the oldest `tox` the plugin claims to support
deps =
  {[test-deps]common}
  tox [testing] == 4.55.1
# NOTE: Measured without coverage, unlike every other env here: the two
# NOTE: cases gated on `tox` v4.62.0 are the only ones that reach the
# NOTE: substitution pass, so at this floor that code is genuinely never
# NOTE: run and a 100% gate would fail the env for doing its job. What
# NOTE: this env asserts is that the suite passes against the declared
# NOTE: floor; the `py` env is where coverage is accounted for.
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m pytest \
      {tty:--color=yes} \
      --no-cov \
      {posargs:}
commands_post =


[testenv:cleanup-dists]
description =
  Wipe the the dist{/} folder
deps =
commands_pre =
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c \
      'import os, shutil, sys; \
      dists_dir = "{toxinidir}{/}dist{/}"; \
      shutil.rmtree(dists_dir, ignore_errors=True); \
      sys.exit(os.path.exists(dists_dir))'
commands_post =
package = skip


[testenv:build-dists]
description =
  Build dists with {basepython} and put them into the dist{/} folder
depends =
  cleanup-dists
deps =
  build
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m build \
      {posargs:}
commands_post =
package = skip


[testenv:metadata-validation]
description =
  Verify that dists under the `dist{/}` dir
  have valid metadata
depends =
  build-dists
deps =
  setuptools-scm
  twine
commands_pre =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    '-Wdefault{:}git archive did not support describe output\
      {:}UserWarning{:}setuptools_scm.git' \
    '-Wdefault{:}unprocessed git archival found\
      {:}UserWarning{:}setuptools_scm.git' \
    -m setuptools_scm \
      ls
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m twine \
      check \
      --strict \
      dist{/}*
commands_post =
package = skip

