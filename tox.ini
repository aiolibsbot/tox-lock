[tox]
isolated_build = true
# NOTE: v4.29.0 is the first one to implement the `tox_extend_envs`
# NOTE: lifecycle hook. But the initial version had a bug fixed in
# NOTE: the following version 4.30.0.
#
# Refs:
# * https://github.com/tox-dev/tox/issues/3510
# * https://github.com/tox-dev/tox/pull/3591
# * https://github.com/tox-dev/tox/pull/3598
#
# NOTE: The floor `pyproject.toml` declares is higher still --
# NOTE: v4.55.1, for the config conversion and override handling
# NOTE: the plugin is built on. See the note beside it there, and
# NOTE: the `oldest-tox` env below, which runs the suite against it.
minversion = 4.55.1

# NOTE: The core settings below and the two envs the plugin seeds exist
# NOTE: only when the plugin is loaded by the `tox` reading this file.
# NOTE: Without it `tox` does not refuse the config -- it ignores the
# NOTE: unknown core keys and, for an env nothing declares a section
# NOTE: for, runs `[testenv]` under that name instead. So
# NOTE: `tox run -e lock-deps-check` on a `tox` without the plugin
# NOTE: reports success having run the test suite, and the CI job whose
# NOTE: name promises the locks are current has checked nothing. Stating
# NOTE: the dependency here is what turns that into a loud failure: it
# NOTE: is satisfied by a plugin already installed alongside `tox`, and
# NOTE: provisioned otherwise.
requires =
  tox-lock

# NOTE: What `tox` with no arguments runs. Every gate in `ci.yml` is
# NOTE: here, so that a contributor's default run and the one that
# NOTE: decides a pull request are the same set rather than two lists
# NOTE: that happen to agree -- `test_ci_gates_run_by_default` keeps
# NOTE: them from drifting. Ordered cheapest-first: the static checks
# NOTE: answer in seconds, the suites take minutes, and the packaging
# NOTE: chain writes to `dist{/}` and so goes last.
#
# NOTE: `cleanup-dists` leads that chain here and does not appear in
# NOTE: `ci.yml`, which starts from a fresh checkout. A work tree does
# NOTE: not: `verify-dists` reads every dist it finds, and one left over
# NOTE: from an earlier build is a dist the check would pass judgement
# NOTE: on without it being the one just built.
#
# NOTE: `lock-deps` is deliberately absent -- it writes the locks, and
# NOTE: nothing that rewrites the work tree belongs in what `tox` does
# NOTE: when asked for nothing in particular. `lock-deps-check` is the
# NOTE: read-only half.
env_list =
  lint
  type-check
  changelog
  lock-deps-check
  py
  oldest-tox
  cleanup-dists
  build-dists
  metadata-validation
  verify-dists
  smoke-dists

# NOTE: `oldest-tox` is locked *together with* `test.in` rather than
# NOTE: instead of it -- `uv pip compile` unions its sources, so the
# NOTE: pin lives in one file and the rest of the list in the other.
lock_files =
  requirements/lock.txt = requirements/lock.in
  requirements/test.txt = requirements/test.in
  requirements/oldest-tox.txt = requirements/test.in, requirements/oldest-tox.in
  requirements/type-check.txt = requirements/test.in, requirements/type-check.in
  requirements/lint.txt = requirements/lint.in
  requirements/changelog.txt = requirements/changelog.in
  requirements/build.txt = requirements/build.in
  requirements/metadata.txt = requirements/metadata.in
# NOTE: `--universal` because a single lock is installed by every env
# NOTE: in the CI matrix: without it `uv` resolves for the platform it
# NOTE: happens to run on and the lock is wrong for the others. That
# NOTE: resolution's Python floor is not stated here: `tox-lock` seeds
# NOTE: `--python-version` off the `requires-python` in
# NOTE: `pyproject.toml`, which is where this project declares it once.
lock_options =
  --generate-hashes
  --universal


[python-cli-options]
byte-warnings = -b
byte-errors = -bb
max-isolation = -E -s -I
some-isolation = -E -s
warnings-to-errors = -Werror


[testenv]
description = Run pytest under {envpython}
deps = -r requirements/test.txt
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m pytest \
      {tty:--color=yes} \
      {posargs:--cov-report=html:{envtmpdir}{/}htmlcov{/}}
commands_post =
  -{envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c \
      'import atexit, os, sys; \
      os.getenv("GITHUB_ACTIONS") == "true" or sys.exit(); \
      import coverage; \
      gh_summary_fd = open(\
        os.environ["GITHUB_STEP_SUMMARY"], encoding="utf-8", mode="a",\
      ); \
      atexit.register(gh_summary_fd.close); \
      cov = coverage.Coverage(); \
      cov.load(); \
      cov.report(file=gh_summary_fd, output_format="markdown")'
  # Print out the output coverage dir and a way to serve html:
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c\
      'import pathlib, shlex, sys; \
      cov_html_report_arg_prefix = "--cov-report=html:"; \
      cov_html_reports = [\
        arg[len(cov_html_report_arg_prefix):] for arg in sys.argv \
        if arg.startswith(cov_html_report_arg_prefix)\
      ]; \
      cov_html_reports or sys.exit(); \
      cov_html_report_dir = pathlib.Path(cov_html_reports[-1]); \
      index_file = cov_html_report_dir / "index.html";\
      index_file.exists() or sys.exit(); \
      html_url = f"file://\{index_file\}";\
      browse_cmd = shlex.join(("python3", "-Im", "webbrowser", html_url)); \
      serve_cmd = shlex.join((\
        "python3", "-Im", "http.server", \
        "--directory", str(cov_html_report_dir), "0", \
      )); \
      print(f"\nTo open the HTML coverage report, run\n\n\
      \t\{browse_cmd !s\}\n");\
      print(f"To serve \
      the HTML coverage report with a local web server, use\n\n\
      \t\{serve_cmd !s\}\n")' \
    {posargs:--cov-report=html:{envtmpdir}{/}htmlcov{/}}
package = editable
pass_env =
  CI
  GITHUB_*
  SSH_AUTH_SOCK
  TERM
set_env =
  COVERAGE_PROCESS_START = {toxinidir}{/}.coveragerc
wheel_build_env = .pkg


# NOTE: The plugin is built out of `tox`'s own configuration
# NOTE: machinery, and that machinery moves: which types core config
# NOTE: converts and whether a `-x` override is expanded before it
# NOTE: reaches the loader both changed under it. So the suite passing
# NOTE: against whatever `tox` a contributor happens to have says
# NOTE: nothing about the floor `pyproject.toml` declares -- the two
# NOTE: drifted apart by twenty-five releases before anyone ran them
# NOTE: together. This env runs the very same tests against that floor,
# NOTE: so that moving it stays a decision rather than a discovery a
# NOTE: user makes for us.
#
# NOTE: The pin belongs here rather than in the CI workflow because the
# NOTE: suite drives `tox` in-process through `tox.pytest`: what gets
# NOTE: exercised is the `tox` installed *into this env*, not the one
# NOTE: that launched it.
[testenv:oldest-tox]
description =
  Run pytest against the oldest `tox` the plugin claims to support
deps = -r requirements/oldest-tox.txt
# NOTE: Measured without coverage, unlike every other env here. One
# NOTE: line of the plugin cannot be reached at this floor: the seed
# NOTE: loader's delegation to `Loader.substitute()`, a method `tox`
# NOTE: only grew in v4.62.0 along with the pass that calls it. At
# NOTE: v4.55.1 there is nothing there to delegate to and nothing that
# NOTE: would, so a 100% gate would fail the env for doing its job.
# NOTE: What this env asserts is that the suite passes against the
# NOTE: declared floor; the `py` env is where coverage is accounted
# NOTE: for, and it now measures that line directly rather than
# NOTE: relying on the lock pinning a `tox` that happens to route
# NOTE: through it.
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m pytest \
      {tty:--color=yes} \
      --no-cov \
      {posargs:}
commands_post =


# NOTE: `.mypy.ini` is a sixty-line strict configuration that nothing
# NOTE: executed for the plugin's first twenty-one increments: it was
# NOTE: committed, and the tree happened to stay clean under it by
# NOTE: accident rather than by a gate. This env is the gate.
#
# NOTE: `mypy` reads the interpreter it should target from
# NOTE: `python_version` in that file, so this env deliberately does
# NOTE: not pin `base_python` -- the check means the same thing under
# NOTE: whichever `python3` a contributor has, and CI runs it once
# NOTE: rather than across the matrix.
[testenv:type-check]
description = Type-check the plugin and its test suite with `mypy`
deps = -r requirements/type-check.txt
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m mypy \
      --config-file {toxinidir}{/}.mypy.ini \
      {posargs:}
commands_post =


# NOTE: `src{/}` and `tests{/}` carried eleven `# noqa` comments --
# NOTE: `ruff` codes among `wemake-python-styleguide` ones and `pylint`
# NOTE: messages -- and `.github{/}workflows{/}ci.yml` a
# NOTE: `# yamllint disable-line`, for twenty-two increments in which
# NOTE: no linter ran. A suppression comment asserts that some checker
# NOTE: reads the line under it, the same way a committed config
# NOTE: asserts that something invokes the tool it configures. This env
# NOTE: is what makes the remaining ones true; the suppressions naming
# NOTE: a linter this project still does not run were deleted instead.
#
# NOTE: Both checkers are pointed at the work tree rather than at a
# NOTE: list of paths, so a directory added later is covered without
# NOTE: anybody remembering to add it here. `ruff` skips what
# NOTE: `.gitignore` names on its own; `yamllint` is told to, in
# NOTE: `.yamllint`.
#
# NOTE: Unpinned `base_python` for the same reason as `type-check`: the
# NOTE: rules are selected by `.ruff.toml`'s `target-version`, not by
# NOTE: the interpreter the linter runs under, so a matrix would repeat
# NOTE: one check four times.
# NOTE: Spelled out because `check-jsonschema` takes files and neither
# NOTE: globs nor walks a directory, and `commands` are run without a
# NOTE: shell to do it for them. Named here rather than twice below so
# NOTE: that a workflow added to this project is added to every check
# NOTE: at once. The list is still a list, and forgetting to put a new
# NOTE: workflow in it is what `tests{/}ci_workflows_test.py` exists to
# NOTE: refuse -- the entry is written by hand, but leaving it out is
# NOTE: a test failure rather than a workflow nothing ever reads.
# NOTE: One line rather than one per file: a `commands` value is read
# NOTE: a line at a time, so a multi-line substitution lands in it as a
# NOTE: second command rather than as more arguments to the first.
[ci-workflows]
files = .github/workflows/ci.yml .github/workflows/lock-refresh.yml .github/workflows/release.yml


[testenv:lint]
description = Lint the sources, the test suite and the CI workflows
deps = -r requirements/lint.txt
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m ruff \
      check \
      {posargs:}
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m yamllint \
      --strict \
      .
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m check_jsonschema \
      --builtin-schema vendor.github-workflows \
      {[ci-workflows]files}
  # NOTE: `dependabot.yml` is what keeps the commit pins in those
  # NOTE: workflows from going stale, and it is as unrunnable from a
  # NOTE: branch as they are -- the same argument for validating it
  # NOTE: here. Its own schema, not the workflow one.
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m check_jsonschema \
      --builtin-schema vendor.dependabot \
      .github/dependabot.yml
  # NOTE: A job without `timeout-minutes` inherits GitHub's default of
  # NOTE: six hours. Eleven of them did, and the one that hangs is the
  # NOTE: one waiting on an index that never answers -- on a matrix
  # NOTE: that includes the runners billed at ten times the rate.
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m check_jsonschema \
      --builtin-schema github-workflows-require-timeout \
      {[ci-workflows]files}
  # NOTE: Not `{envpython} -m`, unlike everything else here: `zizmor`
  # NOTE: is a Rust binary that its wheel ships as a console script,
  # NOTE: with no module for an interpreter to import.
  #
  # NOTE: `--no-online-audits` so that this env answers the same
  # NOTE: whether or not a GitHub token happens to be in the
  # NOTE: environment. The audits it turns off ask an API about the
  # NOTE: actions this workflow calls; a gate whose verdict depends on
  # NOTE: a credential the developer running it may not have is one
  # NOTE: that disagrees with CI for reasons nobody can see locally.
  zizmor \
    --no-online-audits \
    {[ci-workflows]files}
commands_post =
# NOTE: Neither checker imports the code it reads, so there is nothing
# NOTE: here for an installed dist to change.
package = skip


# NOTE: `towncrier` ignores a fragment whose name it does not
# NOTE: recognise: no warning, no output, exit zero. So the note a
# NOTE: contributor wrote at the moment they knew why the change
# NOTE: mattered goes missing between the pull request and the release
# NOTE: page, and the only thing that would have caught it is a check
# NOTE: that reads the directory rather than the rendering. That check
# NOTE: is the first command below and needs nothing installed; the
# NOTE: second is the preview, which is the half a human wants.
#
# NOTE: Cutting a version is not this env's job -- it writes to the
# NOTE: work tree and belongs in a commit somebody made on purpose:
# NOTE: `tox exec -e changelog -- towncrier build --version 1.2.3`.
[testenv:changelog]
description = Check the changelog fragments and preview the result
deps = -r requirements/changelog.txt
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    tests{/}_changelog.py \
      validate \
      pyproject.toml \
      changelog.d{/}
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]some-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m towncrier \
      build \
      --draft \
      --version {posargs:NEXT}
commands_post =
# NOTE: Neither command imports the plugin, and the validator reads the
# NOTE: work tree with the standard library alone.
package = skip


[testenv:cleanup-dists]
description =
  Wipe the the dist{/} folder
deps =
commands_pre =
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -c \
      'import os, shutil, sys; \
      dists_dir = "{toxinidir}{/}dist{/}"; \
      shutil.rmtree(dists_dir, ignore_errors=True); \
      sys.exit(os.path.exists(dists_dir))'
commands_post =
package = skip


[testenv:build-dists]
description =
  Build dists with {basepython} and put them into the dist{/} folder
depends =
  cleanup-dists
deps = -r requirements/build.txt
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m build \
      {posargs:}
commands_post =
package = skip


[testenv:metadata-validation]
description =
  Verify that dists under the `dist{/}` dir
  have valid metadata
depends =
  build-dists
deps = -r requirements/metadata.txt
commands_pre =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    '-Wdefault{:}git archive did not support describe output\
      {:}UserWarning{:}setuptools_scm.git' \
    '-Wdefault{:}unprocessed git archival found\
      {:}UserWarning{:}setuptools_scm.git' \
    -m setuptools_scm \
      ls
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    -m twine \
      check \
      --strict \
      dist{/}*
commands_post =
package = skip


# NOTE: `twine check` reads a dist's metadata and never opens the
# NOTE: package inside it. The plugin runs two of its modules *by
# NOTE: path*, so a packaging change dropping them raises no
# NOTE: `ImportError` anywhere -- it fails in a project that installed
# NOTE: the dist, and never here, because the suite runs against an
# NOTE: editable install where the work tree is the package. This env
# NOTE: is the gate, and `smoke-dists` below is the one that then runs
# NOTE: what it found.
[testenv:verify-dists]
description =
  Verify that dists under the `dist{/}` dir
  ship every module the plugin runs
depends =
  build-dists
deps =
commands_pre =
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    tests{/}_dist_contents.py \
      src{/}tox_plugins \
      dist{/}
commands_post =
# NOTE: The check reads the work tree and two archives with the
# NOTE: standard library alone, so an installed dist would only get in
# NOTE: the way of the one it is meant to be inspecting.
package = skip


# NOTE: `verify-dists` above reads the archives and `metadata-validation`
# NOTE: reads their metadata; neither installs one. So nothing said that
# NOTE: the entry point a build writes actually resolves, that a PEP 420
# NOTE: namespace subpackage imports out of `site-packages`, or that the
# NOTE: scripts found in the archive are found again at the path the
# NOTE: plugin computes from its own `__file__` once that path is an
# NOTE: installation rather than this checkout. Every other env here runs
# NOTE: against an editable install, where the work tree is the package
# NOTE: and all four are true by construction.
#
# NOTE: The dists bring their own dependencies rather than installing
# NOTE: this project's locks: whether the declared floor is enough to
# NOTE: run under is part of what a dist has to get right, and a lock
# NOTE: would answer for the pins a contributor has instead.
[testenv:smoke-dists]
description =
  Verify that dists under the `dist{/}` dir
  seed their envs once installed
depends =
  build-dists
deps =
commands_pre =
commands =
  {envpython} \
    {[python-cli-options]byte-errors} \
    {[python-cli-options]max-isolation} \
    {[python-cli-options]warnings-to-errors} \
    tests{/}_dist_smoke.py \
      dist{/} \
      {envtmpdir}{/}
commands_post =
# NOTE: The check builds an environment of its own for each dist and
# NOTE: installs it there, so an installed dist here would be a second
# NOTE: copy of the very thing under test.
package = skip


# NOTE: The plugin seeds these two envs with a floating `uv`. The
# NOTE: resolver is a lock input like any other -- an unpinned one
# NOTE: makes `lock-deps-check` report resolver drift as source drift
# NOTE: -- so this project pins it the way the plugin expects a project
# NOTE: to: in its own section, which `lock-deps-check` inherits as its
# NOTE: `base`.
[testenv:lock-deps]
deps = -r requirements/lock.txt
